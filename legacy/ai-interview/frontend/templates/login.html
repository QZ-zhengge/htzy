{% extends "base.html" %}

{% block content %}
<div class="flex justify-center items-center min-h-[calc(100vh-12rem)]">
    <div class="w-full max-w-md bg-white rounded-lg shadow-lg overflow-hidden">
        <div class="bg-gradient p-6 text-white">
            <h2 class="text-2xl font-bold text-center">登录</h2>
            <p class="text-center mt-2 opacity-90">登录您的账户开始AI面试</p>
        </div>
        
        <div class="p-8">
            <form id="login-form" class="space-y-6">
                <div>
                    <label for="username" class="block text-gray-700 text-sm font-medium mb-2">用户名</label>
                    <input type="text" id="username" name="username" class="w-full px-4 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-primary focus:border-transparent" placeholder="请输入用户名" required>
                </div>
                
                <div>
                    <label for="password" class="block text-gray-700 text-sm font-medium mb-2">密码</label>
                    <input type="password" id="password" name="password" class="w-full px-4 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-primary focus:border-transparent" placeholder="请输入密码" required>
                </div>
                
                <div class="flex items-center justify-between">
                    <div class="flex items-center">
                        <input type="checkbox" id="remember-me" name="remember-me" class="h-4 w-4 text-primary focus:ring-primary border-gray-300 rounded">
                        <label for="remember-me" class="ml-2 block text-sm text-gray-700">记住我</label>
                    </div>
                    
                    <a href="#" class="text-sm text-primary hover:text-primary/80">忘记密码?</a>
                </div>
                
                <div>
                    <button type="submit" class="w-full bg-primary text-white py-2 px-4 rounded-md hover:bg-primary/90 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-primary transition-all">
                        登录
                    </button>
                </div>
            </form>
            
            <div class="mt-6 text-center">
                <p class="text-sm text-gray-600">
                    还没有账户? <a href="{{ url_for('register_page') }}" class="text-primary hover:text-primary/80 font-medium">立即注册</a>
                </p>
            </div>
        </div>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script>
    document.getElementById('login-form').addEventListener('submit', async function(e) {
        e.preventDefault();
        
        const username = document.getElementById('username').value;
        const password = document.getElementById('password').value;
        
        try {
            const result = await apiRequest('/api/users/login', 'POST', { username, password });
            
            showToast('登录成功', 'success');
            
            // 重定向到仪表盘
            setTimeout(() => {
                window.location.href = "{{ url_for('dashboard') }}";
            }, 1500);
        } catch (error) {
            console.error('登录失败:', error);
        }
    });
</script>
{% endblock %}
