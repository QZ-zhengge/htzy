{% extends "base.html" %}

{% block content %}
<div class="mb-8">
    <h1 class="text-3xl font-bold text-gray-800 mb-2">欢迎回来，{{ session['username'] }}!</h1>
    <p class="text-gray-600">开始您的AI面试之旅，提升面试技能，获得理想工作。</p>
</div>

<!-- 统计卡片 -->
<div class="grid grid-cols-1 md:grid-cols-3 gap-6 mb-8">
    <div class="bg-white rounded-lg shadow-md p-6 transition-all hover:shadow-lg">
        <div class="flex items-center justify-between">
            <div>
                <p class="text-sm text-gray-500 font-medium">已完成面试</p>
                <h3 class="text-2xl font-bold text-gray-800 mt-1" id="completed-interviews">0</h3>
            </div>
            <div class="bg-blue-100 p-3 rounded-full">
                <i class="fa fa-check-circle text-primary text-xl"></i>
            </div>
        </div>
        <div class="mt-4">
            <a href="#" class="text-sm text-primary hover:text-primary/80 font-medium">查看详情</a>
        </div>
    </div>
    
    <div class="bg-white rounded-lg shadow-md p-6 transition-all hover:shadow-lg">
        <div class="flex items-center justify-between">
            <div>
                <p class="text-sm text-gray-500 font-medium">平均得分</p>
                <h3 class="text-2xl font-bold text-gray-800 mt-1" id="average-score">0</h3>
            </div>
            <div class="bg-green-100 p-3 rounded-full">
                <i class="fa fa-line-chart text-success text-xl"></i>
            </div>
        </div>
        <div class="mt-4">
            <a href="#" class="text-sm text-primary hover:text-primary/80 font-medium">查看详情</a>
        </div>
    </div>
    
    <div class="bg-white rounded-lg shadow-md p-6 transition-all hover:shadow-lg">
        <div class="flex items-center justify-between">
            <div>
                <p class="text-sm text-gray-500 font-medium">待完成面试</p>
                <h3 class="text-2xl font-bold text-gray-800 mt-1" id="pending-interviews">0</h3>
            </div>
            <div class="bg-yellow-100 p-3 rounded-full">
                <i class="fa fa-clock-o text-warning text-xl"></i>
            </div>
        </div>
        <div class="mt-4">
            <a href="#" class="text-sm text-primary hover:text-primary/80 font-medium">开始面试</a>
        </div>
    </div>
</div>

<!-- 最近面试结果 -->
<div class="bg-white rounded-lg shadow-md p-6 mb-8">
    <div class="flex justify-between items-center mb-6">
        <h2 class="text-xl font-bold text-gray-800">最近面试结果</h2>
        <a href="#" class="text-primary hover:text-primary/80">查看全部</a>
    </div>
    
    <div class="overflow-x-auto">
        <table class="min-w-full divide-y divide-gray-200">
            <thead>
                <tr>
                    <th class="px-6 py-3 bg-gray-50 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">岗位</th>
                    <th class="px-6 py-3 bg-gray-50 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">日期</th>
                    <th class="px-6 py-3 bg-gray-50 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">专业知识分</th>
                    <th class="px-6 py-3 bg-gray-50 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">语言表达分</th>
                    <th class="px-6 py-3 bg-gray-50 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">表情管理分</th>
                    <th class="px-6 py-3 bg-gray-50 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">总分</th>
                    <th class="px-6 py-3 bg-gray-50 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">操作</th>
                </tr>
            </thead>
            <tbody class="bg-white divide-y divide-gray-200" id="interview-results">
                <tr>
                    <td colspan="7" class="px-6 py-4 text-center text-gray-500">暂无面试记录</td>
                </tr>
            </tbody>
        </table>
    </div>
</div>

<!-- 开始新面试 -->
<div class="bg-white rounded-lg shadow-md p-6">
    <h2 class="text-xl font-bold text-gray-800 mb-6">开始新面试</h2>
    
    <form id="new-interview-form" class="space-y-6">
        <div>
            <label for="job-position" class="block text-gray-700 text-sm font-medium mb-2">意向岗位</label>
            <input type="text" id="job-position" name="job-position" class="w-full px-4 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-primary focus:border-transparent" placeholder="请输入您的意向岗位，如：前端开发工程师" required>
        </div>
        
        <div class="bg-blue-50 border-l-4 border-primary p-4 rounded">
            <div class="flex">
                <div class="flex-shrink-0">
                    <i class="fa fa-info-circle text-primary"></i>
                </div>
                <div class="ml-3">
                    <p class="text-sm text-gray-700">
                        请确保您已上传简历，系统将根据您的简历和意向岗位生成个性化面试题目。
                    </p>
                </div>
            </div>
        </div>
        
        <div class="flex justify-end">
            <button type="submit" class="bg-primary text-white py-2 px-6 rounded-md hover:bg-primary/90 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-primary transition-all">
                开始面试
            </button>
        </div>
    </form>
</div>
{% endblock %}

{% block scripts %}
<script>
    // 获取面试统计数据
    async function fetchInterviewStats() {
        try {
            // 调用API获取用户的面试统计数据
            const response = await fetch('/api/user/interview-stats');

            if (response.ok) {
                const stats = await response.json();

                document.getElementById('completed-interviews').textContent = stats.completed || 0;
                document.getElementById('pending-interviews').textContent = stats.pending || 0;
                document.getElementById('average-score').textContent = stats.averageScore ? stats.averageScore.toFixed(1) : '0';

                // 获取面试结果
                const resultsResponse = await fetch('/api/user/interview-results');
                if (resultsResponse.ok) {
                    const results = await resultsResponse.json();

                    const resultsContainer = document.getElementById('interview-results');
                    resultsContainer.innerHTML = '';

                    if (!results || results.length === 0) {
                        resultsContainer.innerHTML = `
                            <tr>
                                <td colspan="7" class="px-6 py-4 text-center text-gray-500">暂无面试记录</td>
                            </tr>
                        `;
                        return;
                    }

                    results.forEach(result => {
                        const row = document.createElement('tr');

                        // 根据总分设置不同的颜色
                        let scoreColor = 'text-gray-900';
                        const totalScore = result.totalScore || 0;
                        if (totalScore >= 90) {
                            scoreColor = 'text-green-600';
                        } else if (totalScore >= 80) {
                            scoreColor = 'text-blue-600';
                        } else if (totalScore >= 70) {
                            scoreColor = 'text-yellow-600';
                        } else {
                            scoreColor = 'text-red-600';
                        }

                        row.innerHTML = `
                            <td class="px-6 py-4 whitespace-nowrap">
                                <div class="text-sm font-medium text-gray-900">${result.jobPosition || 'null'}</div>
                            </td>
                            <td class="px-6 py-4 whitespace-nowrap">
                                <div class="text-sm text-gray-500">${result.date || 'null'}</div>
                            </td>
                            <td class="px-6 py-4 whitespace-nowrap">
                                <div class="text-sm text-gray-900">${result.professionalScore || 'null'}</div>
                            </td>
                            <td class="px-6 py-4 whitespace-nowrap">
                                <div class="text-sm text-gray-900">${result.languageScore || 'null'}</div>
                            </td>
                            <td class="px-6 py-4 whitespace-nowrap">
                                <div class="text-sm text-gray-900">${result.expressionScore || 'null'}</div>
                            </td>
                            <td class="px-6 py-4 whitespace-nowrap">
                                <div class="text-sm font-medium ${scoreColor}">${totalScore ? totalScore.toFixed(1) : 'null'}</div>
                            </td>
                            <td class="px-6 py-4 whitespace-nowrap text-sm">
                                <a href="#" class="text-primary hover:text-primary/80 mr-3">查看详情</a>
                                <a href="#" class="text-gray-600 hover:text-gray-900">再次面试</a>
                            </td>
                        `;

                        resultsContainer.appendChild(row);
                    });
                } else {
                    console.error('获取面试结果失败:', resultsResponse.statusText);
                    const resultsContainer = document.getElementById('interview-results');
                    resultsContainer.innerHTML = `
                        <tr>
                            <td colspan="7" class="px-6 py-4 text-center text-gray-500">获取面试记录失败</td>
                        </tr>
                    `;
                }
            } else {
                console.error('获取面试统计数据失败:', response.statusText);
                // 如果API调用失败，显示null
                document.getElementById('completed-interviews').textContent = 'null';
                document.getElementById('pending-interviews').textContent = 'null';
                document.getElementById('average-score').textContent = 'null';
            }
        } catch (error) {
            console.error('获取面试统计数据失败:', error);
            showToast('获取数据失败', 'error');
            // 如果发生错误，显示null
            document.getElementById('completed-interviews').textContent = 'null';
            document.getElementById('pending-interviews').textContent = 'null';
            document.getElementById('average-score').textContent = 'null';
            const resultsContainer = document.getElementById('interview-results');
            resultsContainer.innerHTML = `
                <tr>
                    <td colspan="7" class="px-6 py-4 text-center text-gray-500">获取面试记录失败</td>
                </tr>
            `;
        }
    }

    // 创建新面试
    document.getElementById('new-interview-form').addEventListener('submit', async function(e) {
        e.preventDefault();

        const jobPosition = document.getElementById('job-position').value;

        try {
            // 调用API创建新面试
            const response = await fetch('/api/interviews', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({ job_position: jobPosition })
            });

            if (response.ok) {
                const result = await response.json();
                showToast('面试创建成功，正在准备问题...', 'success');

                // 跳转到面试页面
                setTimeout(() => {
                    window.location.href = `/interview/${result.interview_id}`;
                }, 2000);
            } else {
                console.error('创建面试失败:', response.statusText);
                showToast('创建面试失败', 'error');
            }
        } catch (error) {
            console.error('创建面试失败:', error);
            showToast('创建面试失败', 'error');
        }
    });
    
    // 页面加载时获取数据
    document.addEventListener('DOMContentLoaded', function() {
        fetchInterviewStats();
    });
</script>
{% endblock %}
