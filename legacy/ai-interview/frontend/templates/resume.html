{% extends "base.html" %}

{% block content %}
<div class="mb-8">
    <h1 class="text-3xl font-bold text-gray-800 mb-2">简历管理</h1>
    <p class="text-gray-600">上传和管理您的简历，系统将根据简历内容生成个性化面试题目。</p>
</div>

<!-- 上传简历卡片 -->
<div class="bg-white rounded-lg shadow-md p-6 mb-8">
    <h2 class="text-xl font-bold text-gray-800 mb-6">上传简历</h2>
    
    <form id="uploadForm" enctype="multipart/form-data" class="space-y-6">
        <div>
            <label for="resumeFile" class="block text-gray-700 text-sm font-medium mb-2">选择简历文件</label>
            <input type="file" class="w-full px-4 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-primary focus:border-transparent" id="resumeFile" name="file" accept=".pdf,.doc,.docx,.txt" required>
            <p class="mt-1 text-sm text-gray-500">支持PDF、DOC、DOCX、TXT格式</p>
        </div>
        
        <div class="bg-blue-50 border-l-4 border-primary p-4 rounded">
            <div class="flex">
                <div class="flex-shrink-0">
                    <i class="fa fa-info-circle text-primary"></i>
                </div>
                <div class="ml-3">
                    <p class="text-sm text-gray-700">
                        上传的简历将用于分析您的技能和经验，帮助系统生成更符合您背景的面试题目。
                    </p>
                </div>
            </div>
        </div>
        
        <div class="flex justify-end">
            <button type="submit" class="bg-primary text-white py-2 px-6 rounded-md hover:bg-primary/90 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-primary transition-all">
                上传简历
            </button>
        </div>
    </form>
</div>

<!-- 简历列表卡片 -->
<div class="bg-white rounded-lg shadow-md p-6">
    <div class="flex justify-between items-center mb-6">
        <h2 class="text-xl font-bold text-gray-800">我的简历</h2>
    </div>
    
    <div id="resumeList" class="space-y-4"></div>
</div>

<!-- 简历详情模态框 -->
<div id="resumeDetailModal" class="fixed inset-0 bg-black bg-opacity-50 z-50 hidden flex items-center justify-center">
    <div class="bg-white rounded-lg shadow-xl max-w-4xl w-full max-h-[80vh] overflow-y-auto">
        <div class="flex justify-between items-center p-6 border-b">
            <h3 class="text-xl font-bold text-gray-800">简历详情</h3>
            <button onclick="closeModal()" class="text-gray-500 hover:text-gray-700">
                <i class="fa fa-times text-xl"></i>
            </button>
        </div>
        <div class="p-6" id="resumeContent"></div>
        <div class="p-6 border-t flex justify-end">
            <button onclick="closeModal()" class="bg-gray-200 text-gray-800 py-2 px-4 rounded-md hover:bg-gray-300 transition-all">
                关闭
            </button>
        </div>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script>
    document.addEventListener('DOMContentLoaded', function() {
        // 加载简历列表
        loadResumes();

        // 上传简历表单提交
        document.getElementById('uploadForm').addEventListener('submit', function(e) {
            e.preventDefault();
            let formData = new FormData(this);
            
            fetch('/api/resumes', {
                method: 'POST',
                body: formData,
                credentials: 'same-origin'
            })
            .then(response => {
                if (!response.ok) {
                    return response.json().then(error => {
                        throw new Error(error.error);
                    });
                }
                return response.json();
            })
            .then(data => {
                showToast('简历上传成功！', 'success');
                loadResumes();
                document.getElementById('uploadForm').reset();
            })
            .catch(error => {
                showToast('上传失败：' + error.message, 'error');
            });
        });
    });

    // 加载简历列表
    function loadResumes() {
        fetch('/api/resumes', {
            credentials: 'same-origin'
        })
        .then(response => {
            if (!response.ok) {
                return response.json().then(error => {
                    throw new Error(error.error);
                });
            }
            return response.json();
        })
        .then(resumes => {
            const resumeList = document.getElementById('resumeList');
            
            if (resumes.length === 0) {
                resumeList.innerHTML = `
                    <div class="text-center py-12">
                        <i class="fa fa-file-text-o text-gray-400 text-4xl mb-4"></i>
                        <p class="text-gray-500">暂无简历，请上传简历。</p>
                    </div>
                `;
                return;
            }

            let html = '';
            resumes.forEach(function(resume) {
                let uploadTime = resume.upload_time ? new Date(resume.upload_time).toLocaleString() : '未知';
                html += `
                    <div class="border rounded-lg p-4 hover:shadow-md transition-all">
                        <div class="flex justify-between items-start">
                            <div>
                                <h4 class="font-medium text-gray-900">简历 ${resume.id}</h4>
                                <p class="text-sm text-gray-500 mt-1">${uploadTime}</p>
                            </div>
                            <div class="flex space-x-2">
                                <button onclick="viewResume(${resume.id})" class="text-blue-600 hover:text-blue-800">
                                    <i class="fa fa-eye mr-1"></i> 查看
                                </button>
                                <button onclick="deleteResume(${resume.id})" class="text-red-600 hover:text-red-800">
                                    <i class="fa fa-trash mr-1"></i> 删除
                                </button>
                            </div>
                        </div>
                        <div class="mt-3">
                            <p class="text-sm text-gray-600 truncate">文件路径：${resume.file_path}</p>
                        </div>
                    </div>
                `;
            });
            resumeList.innerHTML = html;
        })
        .catch(error => {
            showToast('加载简历失败：' + error.message, 'error');
        });
    }

    // 查看简历详情
    function viewResume(resumeId) {
        fetch(`/api/resumes/${resumeId}`, {
            credentials: 'same-origin'
        })
        .then(response => {
            if (!response.ok) {
                return response.json().then(error => {
                    throw new Error(error.error);
                });
            }
            return response.json();
        })
        .then(resume => {
            const resumeContent = document.getElementById('resumeContent');
            resumeContent.innerHTML = `
                <div class="space-y-4">
                    <div>
                        <h4 class="text-sm font-medium text-gray-500">文件路径</h4>
                        <p class="text-gray-900">${resume.file_path}</p>
                    </div>
                    <div>
                        <h4 class="text-sm font-medium text-gray-500">上传时间</h4>
                        <p class="text-gray-900">${resume.upload_time ? new Date(resume.upload_time).toLocaleString() : '未知'}</p>
                    </div>
                    <div>
                        <h4 class="text-sm font-medium text-gray-500">简历内容</h4>
                        <div class="mt-2 p-4 bg-gray-50 border rounded-md whitespace-pre-wrap">
                            ${resume.content || '无内容'}
                        </div>
                    </div>
                </div>
            `;
            document.getElementById('resumeDetailModal').classList.remove('hidden');
        })
        .catch(error => {
            showToast('获取简历详情失败：' + error.message, 'error');
        });
    }

    // 关闭模态框
    function closeModal() {
        document.getElementById('resumeDetailModal').classList.add('hidden');
    }

    // 删除简历
    function deleteResume(resumeId) {
        if (confirm('确定要删除这个简历吗？')) {
            fetch(`/api/resumes/${resumeId}`, {
                method: 'DELETE',
                credentials: 'same-origin'
            })
            .then(response => {
                if (!response.ok) {
                    return response.json().then(error => {
                        throw new Error(error.error);
                    });
                }
                return response.json();
            })
            .then(data => {
                showToast('简历删除成功！', 'success');
                loadResumes();
            })
            .catch(error => {
                showToast('删除失败：' + error.message, 'error');
            });
        }
    }
</script>
{% endblock %}
